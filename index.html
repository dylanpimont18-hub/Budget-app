<body>
    <div id="hors-ligne" class="bandeau-hors-ligne" role="alert" hidden>
        Pas de connexion internet : les données ne peuvent être ni chargées ni enregistrées.
    </div>

    <div id="mise-a-jour" class="bandeau-mise-a-jour" role="status" hidden>
        <span class="texte">Nouvelle version disponible</span>
        <button type="button" class="btn-primaire">Mettre à jour</button>

    <main id="vue" class="vue">

    <button id="btn-ajout-rapide" class="btn-ajout-rapide" type="button" aria-label="Ajouter une dépense" hidden>+</button>

        <button type="button" data-onglet="recurrentes"><span aria-hidden="true">🔁</span>Récurrentes</button>
        <button type="button" data-onglet="depenses"><span aria-hidden="true">🧾</span>Dépenses</button>
        <button type="button" data-onglet="tableau"><span aria-hidden="true">📊</span>Budget</button>
        <button type="button" data-onglet="objectifs"><span aria-hidden="true">🎯</span>Objectifs</button>
        <button type="button" data-onglet="rapports"><span aria-hidden="true">📑</span>Rapports</button>
    </nav>

    <div id="feuilles"></div>
