<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Budget familial</title>
    <meta name="theme-color" content="#E8E9E1">
    <link rel="icon" type="image/png" href="icones/favicon.png">
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Budget">
</head>
<body>
    <div id="hors-ligne" class="bandeau-hors-ligne" role="alert" hidden>
        Pas de connexion internet : les données ne peuvent être ni chargées ni enregistrées.
    </div>

    <div id="mise-a-jour" class="bandeau-mise-a-jour" role="status" hidden>
        <span class="texte">Nouvelle version disponible</span>
        <button type="button" class="btn-primaire">Mettre à jour</button>
    </div>

    <main id="vue" class="vue">
        <p class="chargement">Chargement…</p>
    </main>

    <button id="btn-ajout-rapide" class="btn-ajout-rapide" type="button" aria-label="Ajouter une dépense" hidden>+</button>

    <nav id="onglets" class="onglets" aria-label="Onglets" hidden>
        <p class="onglets-titre" aria-hidden="true">Budget familial</p>
        <button type="button" data-onglet="recurrentes"><span aria-hidden="true">🔁</span>Récurrentes</button>
        <button type="button" data-onglet="depenses"><span aria-hidden="true">🧾</span>Dépenses</button>
        <button type="button" data-onglet="tableau"><span aria-hidden="true">📊</span>Budget</button>
        <button type="button" data-onglet="objectifs"><span aria-hidden="true">🎯</span>Objectifs</button>
        <button type="button" data-onglet="rapports"><span aria-hidden="true">📑</span>Rapports</button>
    </nav>

    <div id="feuilles"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
